services:
  waveform-a: &waveform-service
    build: .
    image: waveform-handover:latest
    environment:
      WAVEFORM_DB: /data/waveform.db
    volumes:
      # 两个实例挂载同一个命名卷、同一个 SQLite 文件:
      # 写入经 BEGIN IMMEDIATE 跨进程串行,读取走 WAL 快照互不阻塞
      - waveform-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/api/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    ports:
      - "8000:8000"

  waveform-b:
    <<: *waveform-service
    ports:
      - "8001:8000"

volumes:
  waveform-data:
